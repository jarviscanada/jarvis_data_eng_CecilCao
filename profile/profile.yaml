    #URL is optional
    git_url: "https://pokemonball34.itch.io/into-the-dataswarm"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Spearheaded the project as a project manager and programming lead, turning a proof-of-concept game into a fully realized turn-based puzzle game with Trello, Git and Agile Methodologies. Conducted playtesting sessions to discover pain points and bright points, with a post-playtest interview to refine user insights, while making on-the-fly changes on the Unity/C# framework."
